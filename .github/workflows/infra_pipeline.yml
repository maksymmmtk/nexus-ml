name: Infrastructure CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'infrastructure/**'
      - '.github/workflows/infra_pipeline.yml'
  workflow_dispatch:

env:
  AWS_REGION: eu-central-1
  CLUSTER: nexusml-cluster

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: redis
            port: 6379
          - name: prometheus
            port: 9090
          - name: grafana
            port: 3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO: nexusml-${{ matrix.name }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPO:$IMAGE_TAG ./infrastructure/${{ matrix.name }}
          docker push $REGISTRY/$REPO:$IMAGE_TAG

      - name: Copy Task Def Template
        run: cp infrastructure/${{ matrix.name }}/task-def-template.json task-def.json

      - name: Render Task Def
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ matrix.name }}
          image: ${{ steps.login-ecr.outputs.registry }}/nexusml-${{ matrix.name }}:${{ github.sha }}

      - name: Register Task Def and Create Service if not exists
        run: |
          SERVICE_NAME="nexusml-${{ matrix.name }}-service"
          FAMILY_NAME="nexusml-${{ matrix.name }}"
          CLUSTER="${{ env.CLUSTER }}"
          
          TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json file://task-def.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered Task Definition: $TASK_DEF_ARN"
          
          STATUS=$(aws ecs describe-services --cluster $CLUSTER --services $SERVICE_NAME --query "services[0].status" --output text)
          
          if [ "$STATUS" == "None" ] || [ "$STATUS" == "INACTIVE" ]; then
            echo "Service $SERVICE_NAME does not exist. Configuring Service Discovery..."
            
            NAMESPACE_ID=$(aws servicediscovery list-namespaces --query "Namespaces[?Name=='nexusml.local'].Id" --output text)
            REGISTRY_ARN=$(aws servicediscovery list-services --filters Name=NAMESPACE_ID,Values=$NAMESPACE_ID,Condition=EQ --query "Services[?Name=='${{ matrix.name }}'].Arn" --output text)
            
            if [ -z "$REGISTRY_ARN" ] || [ "$REGISTRY_ARN" == "None" ]; then
              echo "Creating Cloud Map record for ${{ matrix.name }}..."
              REGISTRY_ARN=$(aws servicediscovery create-service \
                --name "${{ matrix.name }}" \
                --namespace-id "$NAMESPACE_ID" \
                --dns-config "NamespaceId=$NAMESPACE_ID,RoutingPolicy=MULTIVALUE,DnsRecords=[{Type=A,TTL=60}]" \
                --health-check-custom-config FailureThreshold=1 \
                --query 'Service.Arn' --output text)
              sleep 5
            fi

            echo "Creating ECS Service with Service Discovery..."
            aws ecs create-service \
              --cluster $CLUSTER \
              --service-name $SERVICE_NAME \
              --task-definition $TASK_DEF_ARN \
              --desired-count 1 \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[subnet-05b51248c23c0fe2c,subnet-0253e574f45955295,subnet-070badba59fd05cd8],securityGroups=[sg-0cafc2af14168a4b1],assignPublicIp=ENABLED}" \
              --service-registries "registryArn=$REGISTRY_ARN"
          else
            echo "Service exists ($STATUS). Skipping creation, handing over to deploy action..."
          fi

      - name: Deploy Service to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: nexusml-${{ matrix.name }}-service
          cluster: ${{ env.CLUSTER }}
          wait-for-service-stability: true