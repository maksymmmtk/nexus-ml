name: App CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/app_pipeline.yml'
  pull_request:
    branches: [ "main" ]

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: nexusml-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest httpx

      - name: Lint with Flake8
        run: |
          flake8 app/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Pytest
        run: |
          python -m pytest -v tests/

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building image with tag $IMAGE_TAG..."
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  prepare-matrix:
    runs-on: ubuntu-latest
    needs: build-and-push
    outputs:
      models: ${{ steps.set-matrix.outputs.models }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch production models from S3
        id: set-matrix
        env:
          AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
        run: |
          FILES=$(aws s3api list-objects-v2 --bucket $AWS_BUCKET_NAME --prefix production/ --query "Contents[?ends_with(Key, '.onnx')].Key" --output text)
          if [ "$FILES" == "None" ] || [ -z "$FILES" ]; then
            echo "models=[]" >> $GITHUB_OUTPUT
          else
            MODELS=$(echo "$FILES" | tr '\t' '\n' | sed 's/production\///g' | sed 's/_model\.onnx//g' | sed 's/\.onnx//g')
            JSON_ARRAY=$(echo "$MODELS" | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "models=$JSON_ARRAY" >> $GITHUB_OUTPUT
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push, prepare-matrix]
    if: ${{ needs.prepare-matrix.outputs.models != '[]' }}
    strategy:
      matrix:
        model_name: ${{ fromJson(needs.prepare-matrix.outputs.models) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Inject Dynamic Values into Task Definition
        run: |
          sed "s/__MODEL_NAME__/${{ matrix.model_name }}_model.onnx/g" task-def-template.json > task-def.json
          sed -i "s/__FAMILY_NAME__/nexusml-api-${{ matrix.model_name }}/g" task-def.json

      - name: Render Task Def
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: api
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Register Task Def and Create Service if not exists
        run: |
          SERVICE_NAME="nexusml-api-${{ matrix.model_name }}-service"
          FAMILY_NAME="nexusml-api-${{ matrix.model_name }}"
          CLUSTER="nexusml-cluster"
          
          TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json file://task-def.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered Task Definition: $TASK_DEF_ARN"
          
          STATUS=$(aws ecs describe-services --cluster $CLUSTER --services $SERVICE_NAME --query "services[0].status" --output text)
          
          if [ "$STATUS" == "None" ] || [ "$STATUS" == "INACTIVE" ]; then
            echo "Service $SERVICE_NAME does not exist. Creating automatically..."
            aws ecs create-service \
              --cluster $CLUSTER \
              --service-name $SERVICE_NAME \
              --task-definition $TASK_DEF_ARN \
              --desired-count 1 \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[subnet-05b51248c23c0fe2c,subnet-0253e574f45955295,subnet-070badba59fd05cd8],securityGroups=[sg-0cafc2af14168a4b1],assignPublicIp=ENABLED}"
          else
            echo "Service exists ($STATUS). Skipping creation, handing over to deploy action..."
          fi      

      - name: Deploy Service to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: nexusml-api-${{ matrix.model_name }}-service
          cluster: nexusml-cluster
          wait-for-service-stability: true

      - name: Send Deployment Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Deployment complete: nexusml-api-${{ matrix.model_name }}"
          to: ${{ secrets.MAIL_USERNAME }}
          from: NexusML CI/CD
          body: |
            Deploy status: ${{ job.status }}
            Model: ${{ matrix.model_name }}
            
            The service has been successfully deployed (or updated) on AWS ECS Fargate.
            
            Service management in the AWS Console:
            https://${{ env.AWS_REGION }}.console.aws.amazon.com/ecs/v2/clusters/nexusml-cluster/services/nexusml-api-${{ matrix.model_name }}-service/health?region=${{ env.AWS_REGION }}
            
            Pipeline details:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}