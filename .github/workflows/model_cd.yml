name: Model Validation and CD

on:
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest onnxruntime numpy boto3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Download models from Staging (S3)
        env:
          AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
        run: python scripts/s3_sync.py download

      - name: Validate Models (Shape, Accuracy, Latency)
        env:
          MODELS_DIR: ./scripts/staging
        run: pytest tests/test_model.py -v

      - name: Promote Models to Production (S3)
        if: success() # This step runs ONLY if the pytest step passed
        env:
          AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
        run: python scripts/s3_sync.py promote