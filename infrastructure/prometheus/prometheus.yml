global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'nexusml-models'
    ecs_sd_configs:
      - region: eu-central-1
        port: 8000
    relabel_configs:
      - source_labels: [__meta_ecs_cluster_name]
        action: keep
        regex: nexusml-cluster
      - source_labels: [__meta_ecs_container_name]
        action: keep
        regex: api
      - source_labels: [__meta_ecs_task_definition_family]
        target_label: model_family