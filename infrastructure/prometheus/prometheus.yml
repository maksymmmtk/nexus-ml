global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'nexusml-models'
    ecs_sd_configs:
      - region: eu-central-1
        port: 8000
    relabel_configs:
      - source_labels: [__meta_ecs_cluster]
        action: keep
        regex: 'nexusml-cluster'
      - source_labels: [__meta_ecs_service]
        action: keep
        regex: '^nexusml-api-.*'
      - source_labels: [__meta_ecs_service]
        regex: '^nexusml-api-(.*)-service$'
        target_label: model_family
        replacement: '$1'